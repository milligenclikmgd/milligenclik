<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başkanlık Divanı Yönetimi</title><style>body{font-family:Arial;background:#f4f7fb;color:#17345d;padding:35px}.box{max-width:900px;margin:auto;background:#fff;padding:28px;border-radius:16px}label{display:block;font-weight:700;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #ccd8e7;border-radius:8px}.editor{min-height:150px;border:1px solid #ccd8e7;border-radius:8px;padding:12px;margin-top:6px}.toolbar button,button{padding:9px 13px;border:0;border-radius:7px;background:#0879e8;color:#fff;font-weight:700;cursor:pointer;margin:4px}.row{border-bottom:1px solid #e5ebf3;padding:12px 0}</style></head><body><main class="box"><h1>Başkanlık Divanı Yönetimi</h1><p>Sayfadaki bilgiler tarayıcı taslağına kaydedilir. Özgeçmiş alanı zengin metin biçimlendirmesini destekler.</p><label>Ad Soyad<input id="name"></label><label>Görev<input id="title"></label><label>Özgeçmiş</label><div class="toolbar"><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>İ</i></button><button onclick="cmd('insertUnorderedList')">• Liste</button></div><div id="bio" class="editor" contenteditable="true"></div><label>X bağlantısı<input id="x"></label><label>Instagram bağlantısı<input id="ig"></label><label>YouTube bağlantısı<input id="yt"></label><label>LinkedIn bağlantısı<input id="in"></label><label>Başkan yardımcıları <small>(her satıra bir isim)</small><textarea id="assistants"></textarea></label><button onclick="save()">Kaydet</button><p id="status"></p><h2>Kayıtlı kişiler</h2><div id="list"></div></main><script>const key='mgd-divan',get=()=>JSON.parse(localStorage.getItem(key)||'[]'),saveData=x=>localStorage.setItem(key,JSON.stringify(x));function cmd(x){document.execCommand(x,false,null)}function save(){const a=get();a.push({name:name.value,title:title.value,bio:bio.innerHTML,social:{x:x.value,ig:ig.value,yt:yt.value,in:in.value},assistants:assistants.value.split('\n').filter(Boolean)});saveData(a);status.textContent='Kayıt kaydedildi.';draw()}function draw(){list.innerHTML=get().map((p,i)=>'<div class="row">'+p.name+' · '+p.title+' <button onclick="removeItem('+i+')">Sil</button></div>').join('')||'Kayıt yok.'}function removeItem(i){const a=get();a.splice(i,1);saveData(a);draw()}draw()</script></body></html>
