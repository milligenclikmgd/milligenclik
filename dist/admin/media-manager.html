<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medya Yönetimi</title><style>body{font-family:Arial;background:#f4f7fb;color:#17345d;margin:0;padding:35px}.box{max-width:850px;margin:auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #1232}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd7e6;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;background:#0879e8;color:#fff;font-weight:700;cursor:pointer;margin-top:18px}.record{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5eaf1}.delete{background:#d33;margin:0;padding:7px 12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>Medya ve Yayınlar Yönetimi</h1><p>Yeni içerik ekleyin; PDF veya doğrudan görüntüleme/indirme bağlantısı tanımlayın.</p><form id="form"><div class="grid"><label>Başlık<input id="title" required></label><label>Kategori<select id="category"><option>Konseptler</option><option>Broşür ve Pankartlar</option><option>Yayınlarımız</option><option>Kurumsal Kimlik</option></select></label><label>Yayın tarihi<input id="date" type="date"></label><label>Görüntüle / İndir bağlantısı<input id="url" type="url" placeholder="https://..."></label><label>PDF yükle<input id="file" type="file" accept="application/pdf"></label></div><button>Kaydet</button></form><section id="list"></section><p><a href="media.html">Medya sayfasını görüntüle</a></p></main><script>const key='mgd-media-items',get=()=>JSON.parse(localStorage.getItem(key)||'[]'),save=x=>localStorage.setItem(key,JSON.stringify(x));function draw(){const l=document.querySelector('#list'),a=get();l.innerHTML=a.length?'<h2>Kayıtlar</h2>'+a.map((x,i)=>'<div class="record"><span>'+x[0]+' · '+x[1]+'</span><button class="delete" onclick="del('+i+')">Sil</button></div>').join(''):'<p>Henüz içerik eklenmedi.</p>'}function del(i){const a=get();a.splice(i,1);save(a);draw()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const f=document.querySelector('#file').files[0],finish=url=>{const a=get();a.push([title.value,category.value,date.value||'',title.value,url||'']);save(a);e.target.reset();draw()};if(f){const rd=new FileReader();rd.onload=()=>finish(rd.result);rd.readAsDataURL(f)}else finish(document.querySelector('#url').value)};draw();</script></body></html>
