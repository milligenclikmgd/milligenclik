<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Yönetim Paneli · Millî Gençlik</title><link rel="stylesheet" href="admin.css"></head><body>
<main id="login" class="login"><section class="login-card"><span class="monogram">MG</span><p class="kicker">MİLLÎ GENÇLİK DERNEĞİ</p><h1>Yönetim paneli</h1><p>İçeriklerinizi tek yerden yönetin.</p><form id="login-form"><label>E-posta<input id="email" type="email" autocomplete="username" required></label><label>Şifre<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="login-button">Giriş yap</button></form><p id="login-status" role="status"></p><a href="../">← Siteye dön</a></section></main>
<div id="panel" hidden><aside><a class="brand" href="../">MG <span>Yönetim paneli</span></a><p class="kicker">İÇERİK</p><nav><button data-section="slides" class="active">Ana sayfa slider</button><button data-section="news">Haberler ve duyurular</button><a href="media-manager.html" style="display:block;padding:12px 16px;color:inherit;text-decoration:none">Medya ve Yayınlar</a><a href="divan-manager.html" style="display:block;padding:12px 16px;color:inherit;text-decoration:none">Başkanlık Divanı</a></nav><div class="sidebar-bottom"><small id="account"></small><button id="logout">Çıkış yap</button></div></aside><main class="workspace"><header><div><p class="kicker">MİLLÎ GENÇLİK DERNEĞİ</p><h1 id="heading">Ana sayfa slider</h1></div><a href="../" target="_blank" rel="noopener">Siteyi görüntüle ↗</a></header><p id="panel-status" role="status" aria-live="polite"></p><div class="toolbar"><input id="filter" placeholder="Başlık ara…" aria-label="Başlık ara"><button id="add" class="primary">Yeni slider</button></div><div class="layout"><section class="records"><div id="list"></div></section><section class="editor"><div id="empty">Düzenlemek için bir kayıt seçin veya yeni içerik ekleyin.</div><form id="content-form" hidden><div class="form-heading"><h2 id="form-title">İçerik düzenle</h2><span id="record-state"></span></div><label>Başlık<textarea id="title" rows="2" maxlength="160" required></textarea><small id="title-help">En fazla 2 satır. Satır sonu için Enter kullanın.</small></label><label>Kısa açıklama<textarea id="summary" rows="3" maxlength="400"></textarea></label><div class="slider-only"><div class="two"><label>Buton yazısı<input id="button-label" maxlength="60"></label><label>Buton bağlantısı<input id="button-url" placeholder="#subeler veya https://…"></label></div><div class="two"><label>Sıra<input id="sort-order" type="number" min="0" max="999" value="0"></label><label>Görsel odağı · yatay (%)<input id="focus-x" type="number" min="0" max="100" value="50"></label></div></div><div class="news-only" hidden><label>Tür<select id="category"><option>Haber</option><option>Duyuru</option></select></label><label>Yayın tarihi<input id="published-at" type="date"></label><label>Haber içeriği<textarea id="body" rows="10" maxlength="30000"></textarea><small>Paragraflarınızı boş satırla ayırabilirsiniz.</small></label></div><label id="cover-label">Masaüstü görseli / haber kapağı<input id="image" type="file" accept="image/jpeg,image/png,image/webp"><small id="image-help">Slider: 1920 × 900 px. JPEG, PNG veya WEBP; en fazla 5 MB.</small></label><div class="slider-only"><label>Mobil görsel · isteğe bağlı<input id="mobile-image" type="file" accept="image/jpeg,image/png,image/webp"><small>1080 × 1920 px. Seçilmezse masaüstü görseli kullanılır.</small></label><label class="check"><input id="clear-mobile" type="checkbox">Mevcut mobil görseli kaldır</label></div><div class="preview-toolbar"><b>Önizleme</b><button type="button" id="preview-mode">Mobil görünüm</button></div><div id="preview" class="preview"><img id="preview-image" alt=""><div><h2 id="preview-title"></h2><p id="preview-summary"></p><span id="preview-button"></span></div></div><label>Durum<select id="status"><option value="draft">Taslak</option><option value="published">Yayında</option></select></label><div class="form-actions"><button id="save" class="primary">Kaydet</button><button id="delete" type="button" class="danger">Sil</button></div></form></section></div></main></div>
<script src="../cms-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><script src="admin.js"></script></body></html>
