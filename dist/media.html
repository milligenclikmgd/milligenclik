dth:2;stroke-linecap:round;stroke-linejoin:round}.date{color:#73859d;font-size:12px}@media(max-width:900px){.media-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.media-page{padding-top:90px}.media-grid{grid-template-columns:1fr}.media-tabs{flex-wrap:nowrap;overflow:auto}.media-tabs a{white-space:nowrap}}

<script>
const data=[['Kurban Bayramı — 2026','Konseptler','13.05.2026','Kurban Bayramı'],['İl ve İlçe Toplantıları','Konseptler','29.04.2026','İl ve İlçe Toplantıları'],['Erbakan Haftası — 2026','Konseptler','12.02.2026','Erbakan Haftası'],['Ramazan 2026','Konseptler','09.01.2026','Ramazan 2026'],['Broşür ve Pankartlar','Broşür ve Pankartlar','22.03.2026','Broşür ve Pankartlar'],['MGD Yayınları','Yayınlarımız','04.03.2026','MGD Yayınları']];
const params=new URLSearchParams(location.search),grid=document.querySelector('#grid'),search=document.querySelector('#search'),tabs=[...document.querySelectorAll('[data-category]')],selectedCategory=()=>new URLSearchParams(location.search).get('category')||'Tümü';
function activate(){const c=selectedCategory();tabs.forEach(a=>a.classList.toggle('active',a.dataset.category===c));}
function render(){const c=selectedCategory(),term=(search.value||'').toLocaleLowerCase('tr');const list=data.filter(x=>(c==='Tümü'||x[1]===c)&&x[0].toLocaleLowerCase('tr').includes(term));grid.innerHTML=list.map(x=>'<article class="card"><div class="visual"><div class="cover">'+x[3]+'</div></div><div class="body"><div class="category">'+x[1]+'</div><h2 class="title">'+x[0]+'</h2><div class="meta"><div class="actions"><a class="view-download" href="#" download aria-label="Görüntüle ve İndir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"></path></svg><span>Görüntüle ve İndir</span></a></div><span class="date">'+x[2]+'</span></div></div></article>').join('')||'<p>Bu kategoride içerik bulunamadı.</p>'}
tabs.forEach(a=>a.addEventListener('click',e=>{e.preventDefault();history.pushState({},'',a.href);activate();render();window.scrollTo({top:0,behavior:'smooth'})}));
document.querySelector('.media-dropdown .dropdown-trigger')?.addEventListener('click',e=>{e.preventDefault();document.querySelector('#media-submenu')?.classList.toggle('open')});
document.addEventListener('click',e=>{if(!e.target.closest('.media-dropdown'))document.querySelector('#media-submenu')?.classList.remove('open')});
window.addEventListener('popstate',()=>{activate();render()});search.addEventListener('input',render);activate();render();
</script></body></html>
