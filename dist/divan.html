const close=()=>{modal.classList.add('closing');setTimeout(()=>{modal.classList.remove('open','closing');document.body.style.overflow=''},420)};document.querySelector('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
document.querySelector('#assistant-tab').onclick=()=>{document.querySelector('#bio-tab').classList.remove('active');document.querySelector('#assistant-tab').classList.add('active');detail.innerHTML='<div class="assistants">'+people.slice(0,5).map(p=>'<div class="assistant">'+p[0]+' · '+p[1]+'</div>').join('')+'</div>'};
document.querySelector('#bio-tab').onclick=()=>{document.querySelector('#assistant-tab').classList.remove('active');document.querySelector('#bio-tab').classList.add('active');detail.innerHTML='<p class="bio">Bu kişinin özgeçmiş bilgileri panel üzerinden düzenlenebilir. Görev alanı ve dernek bünyesindeki çalışmaları burada görüntülenir.</p>'};
document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===btn));const councilOn=btn.dataset.view==='council';page.classList.toggle('council-mode',councilOn);page.classList.toggle('board-mode',!councilOn);document.querySelector('#board').hidden=councilOn;document.querySelector('#president-section').hidden=councilOn;document.querySelector('#council').hidden=!councilOn});
</script></body></html>
