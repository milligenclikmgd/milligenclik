<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Başkanlık Divanı · Millî Gençlik Derneği</title><link rel="stylesheet" href="style.css"><style>
body{background:#f4f8fd}.divan-page{min-height:100vh;padding:120px 0 100px;background:radial-gradient(circle at 18% 30%,#dcecff 0,transparent 28%),linear-gradient(135deg,#f8fbff,#e9f2fb);position:relative;overflow:hidden}.divan-page.board-mode:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#06346718,#fff8 50%,#0c4c8e16);opacity:.8}.divan-page.council-mode{background:radial-gradient(circle at 20% 20%,#d6a53b18,transparent 30%),linear-gradient(135deg,#f8fbff,#e9f2fb)}.divan-page.council-mode:before{background:linear-gradient(135deg,#06346712,#fff8 50%,#0c4c8e12)}.divan-page>*{position:relative}.divan-title{text-align:center;color:#123a6b;font-size:clamp(38px,5vw,70px);margin:25px 0 35px}.divan-tabs{display:flex;justify-content:center;margin-bottom:35px}.divan-tabs button{border:0;padding:16px 38px;background:#e7eef8;color:#123a6b;font-size:17px;font-weight:700}.divan-tabs button:first-child{border-radius:14px 0 0 14px}.divan-tabs button:last-child{border-radius:0 14px 14px 0}.divan-tabs button.active{background:#063b70;color:#fff}.divan-tabs button[data-view="council"].active{color:#d9a52d}.general-card{box-shadow:0 10px 24px #123b6618}.council-grid .person-photo{background:#063b70}.council-grid .person-placeholder{color:#fff}.council-grid .person-card{min-height:300px}.president{max-width:330px;margin:0 auto 30px}.president .person-card{box-shadow:none;border:0;background:transparent}.president .person-photo{border-radius:18px 18px 0 0}.president .person-info{background:#fff;border-radius:0 0 18px 18px}.board-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.person-card{border:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px #123b6618;cursor:pointer;transition:transform .3s,box-shadow .3s}.person-card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 22px 38px #123b6640}.person-photo{height:210px;background:linear-gradient(145deg,#e3edf8,#fff);display:flex;align-items:end;justify-content:center;overflow:hidden}.person-photo img{max-width:100%;max-height:100%;object-fit:contain}.person-placeholder{font-size:60px;color:#174d83;margin-bottom:25px}.person-info{text-align:center;padding:14px 10px 17px}.person-info h3{color:#123a6b;font-size:17px;margin:0 0 5px}.person-info p{color:#59718e;margin:0;font-size:13px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#051a35b8;backdrop-filter:blur(10px);z-index:50;padding:20px}.modal.open{display:flex}.modal.closing{animation:fadeOut .42s forwards}@keyframes fadeOut{to{opacity:0}}.modal-box{width:min(1120px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;display:grid;grid-template-columns:360px 1fr;gap:0;box-shadow:0 30px 100px #001b3c66;transform:translateY(30px) scale(.96);opacity:0;animation:modalIn .55s forwards}.modal.open .modal-box{animation:modalIn .55s forwards}@keyframes modalIn{to{transform:none;opacity:1}}.modal-side{padding:28px;background:linear-gradient(150deg,#eef5fc,#fff);text-align:center}.modal-side .person-photo{height:330px;border-radius:16px}.modal-side h2{color:#123a6b;margin:17px 0 4px}.modal-side p{color:#59718e}.socials{display:flex;justify-content:center;gap:10px;margin-top:22px}.socials a{width:40px;height:40px;border-radius:10px;background:#e4edf8;color:#123a6b;display:grid;place-items:center;text-decoration:none;font-weight:800}.socials svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.modal-content{padding:30px 36px;position:relative}.close{position:absolute;right:22px;top:18px;border:0;background:transparent;font-size:32px;color:#123a6b;cursor:pointer}.detail-tabs{display:flex;gap:8px;margin-bottom:25px}.detail-tabs button{padding:13px 20px;border:0;border-radius:12px;background:#edf3fa;color:#123a6b;font-weight:700;cursor:pointer}.detail-tabs button.active{background:#063b70;color:white}.detail-panel{animation:fadeText .7s both}@keyframes fadeText{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.bio{color:#263b55;line-height:1.85;font-size:16px}.assistants{display:grid;gap:10px}.assistant{padding:13px 16px;border-radius:10px;background:#f0f5fb;color:#123a6b;font-weight:700}@media(max-width:900px){.board-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.board-grid{grid-template-columns:repeat(2,1fr)}.modal-box{grid-template-columns:1fr}.modal-side .person-photo{height:230px}.modal-content{padding:25px 20px}.divan-tabs button{padding:13px 16px;font-size:14px}}
</style></head><body><div data-site-header></div><script src="header.js?v=1"></script><main class="divan-page"><div class="wrap"><p class="eyebrow" style="text-align:center">MİLLÎ GENÇLİK DERNEĞİ</p><h1 class="divan-title">Başkanlık Divanı</h1><div class="divan-tabs"><button class="active" data-view="board">Başkanlık Divanı</button><button data-view="council">İstişare Kurulu</button></div><section class="president" id="president-section"><button class="person-card general-card" data-person="Ahmet Özvatan" data-title="Genel Başkan"><div class="person-photo"><div class="person-placeholder">MG</div></div><div class="person-info"><h3>Ahmet Özvatan</h3><p>Genel Başkan</p></div></button></section><section class="board-grid" id="board"></section><section class="board-grid council-grid" id="council" hidden></section></div></main><div class="modal" id="modal"><div class="modal-box"><aside class="modal-side"><button class="close" id="close">×</button><div class="person-photo"><div class="person-placeholder">MG</div></div><h2 id="modal-name"></h2><p id="modal-title"></p><div class="socials"><a href="#" aria-label="X"><svg viewBox="0 0 24 24"><path d="M5 4l14 16M19 4 5 20"></path></svg></a><a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></a><a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="m10 9 5 3-5 3Z"></path></svg></a><a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M6 9v9M6 6v.1M10 18v-5a3 3 0 0 1 6 0v5M10 10v8"></path></svg></a></div></aside><section class="modal-content"><div class="detail-tabs"><button class="active" id="bio-tab">Özgeçmiş</button><button id="assistant-tab">Başkan Yardımcıları</button></div><div class="detail-panel" id="detail"></div></section></div></div><script>
const people=[['Hakan Birşen','Genel Başkan Yardımcısı'],['Mehmet Emin Alkan','Genel Başkan Yardımcısı'],['Muhammet Enes Kaya','Genel Başkan Yardımcısı'],['Yusuf Caner','Genel Başkan Yardımcısı'],['M. Akif Gül','Genel Başkan Yardımcısı'],['Süleyman Çelik','Genel Başkan Yardımcısı'],['İsmail Hakkı Yılmaz','Genel Başkan Yardımcısı'],['Talha Erdem','Genel Sekreter'],['Adnan Simit','Teşkilat Başkanı'],['Mesut Doğan','Siyasi İşler Başkanı']];
const council=[['Ali Seyyar','Teşkilat Başkanı'],['Metin Gürcü','Genel Sekreter'],['Özgür Mertgenç','Mali İşler Başkanı'],['Harun Pala','Müesseseler Başkanı'],['Dr. Murat Aktaş','Eğitim Başkanı'],['Musab Sungur','Tanıtım ve Medya Başkanı'],['Şükrü Can Atagün','Üniversiteler Komisyonu Başkanı'],['Hakan Birşen','Ortaöğretim Komisyonu Başkanı']];
const page=document.querySelector('.divan-page');page.classList.add('board-mode');const board=document.querySelector('#board'),cgrid=document.querySelector('#council'),modal=document.querySelector('#modal'),detail=document.querySelector('#detail'),nameEl=document.querySelector('#modal-name'),titleEl=document.querySelector('#modal-title');
function cards(list,target){target.innerHTML=list.map((p,i)=>'<button class="person-card" data-list="'+target.id+'" data-i="'+i+'"><div class="person-photo"><div class="person-placeholder">'+p[0].split(' ').map(x=>x[0]).slice(0,2).join('')+'</div></div><div class="person-info"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div></button>').join('')}
cards(people,board);cards(council,cgrid);
function openPerson(p){nameEl.textContent=p[0];titleEl.textContent=p[1];detail.innerHTML='<p class="bio">Bu kişinin özgeçmiş bilgileri panel üzerinden düzenlenebilir. Görev alanı, çalışma hayatı ve dernek bünyesindeki sorumlulukları burada görüntülenir.</p>';modal.classList.add('open');document.body.style.overflow='hidden'}
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openPerson((b.dataset.list==='council'?council:people)[b.dataset.i]));
document.querySelector('[data-person]').onclick=()=>openPerson(['Ahmet Özvatan','Genel Başkan']);
const close=()=>{modal.classList.add('closing');setTimeout(()=>{modal.classList.remove('open','closing');document.body.style.overflow=''},420)};document.querySelector('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
document.querySelector('#assistant-tab').onclick=()=>{document.querySelector('#bio-tab').classList.remove('active');document.querySelector('#assistant-tab').classList.add('active');detail.innerHTML='<div class="assistants">'+people.slice(0,5).map(p=>'<div class="assistant">'+p[0]+' · '+p[1]+'</div>').join('')+'</div>'};
document.querySelector('#bio-tab').onclick=()=>{document.querySelector('#assistant-tab').classList.remove('active');document.querySelector('#bio-tab').classList.add('active');detail.innerHTML='<p class="bio">Bu kişinin özgeçmiş bilgileri panel üzerinden düzenlenebilir. Görev alanı ve dernek bünyesindeki çalışmaları burada görüntülenir.</p>'};
document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===btn));const councilOn=btn.dataset.view==='council';page.classList.toggle('council-mode',councilOn);page.classList.toggle('board-mode',!councilOn);document.querySelector('#board').hidden=councilOn;document.querySelector('#president-section').hidden=councilOn;document.querySelector('#council').hidden=!councilOn});
</script></body></html>
