<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGD Yönetim Paneli</title><style>body{margin:0;background:#f3f6fb;font-family:Arial;color:#123a6b}.login,.app{max-width:1100px;margin:45px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 15px 45px #1233}.login{max-width:380px}.app{display:none}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd8e7;border-radius:8px;margin:6px 0 15px}button{border:0;border-radius:8px;padding:10px 15px;background:#0879e8;color:#fff;font-weight:700;cursor:pointer;margin:4px}.danger{background:#c93636}.row{display:grid;grid-template-columns:1fr 1fr 110px 170px auto;gap:8px;align-items:center;border-bottom:1px solid #e5ebf3;padding:10px 0}.card{border:1px solid #dce5f0;padding:18px;border-radius:12px;margin-top:20px}@media(max-width:800px){.row{grid-template-columns:1fr}.app{margin:10px}}
</style></head><body><section class="login" id="login"><h1>MGD Panel</h1><label>Kullanıcı adı<input id="user"></label><label>Şifre<input id="pass" type="password"></label><button onclick="login()">Giriş yap</button><p id="err"></p></section><main class="app" id="app"><h1>Başkanlık Divanı Yönetimi</h1><p>Üyeleri ekleyin, silin ve yukarı/aşağı taşıyarak sıralayın.</p><div class="card"><label>Ad Soyad<input id="name"></label><label>Görev / Ünvan<input id="title"></label><label>Fotoğraf yolu veya bağlantısı<input id="photo"></label><label>Özgeçmiş<textarea id="bio"></textarea></label><label>Kurul<select id="group"><option value="board">Başkanlık Divanı</option><option value="council">İstişare Kurulu</option></select></label><button onclick="add()">Üye ekle</button></div><h2>Üyeler</h2><div id="list"></div></main><script>const key='mgd-board-admin',seed=[['Ali Seyyar','Teşkilat Başkanı'],['Metin Gürcü','Genel Sekreter'],['Özgür Mertgenç','Mali İşler Başkanı'],['Harun Pala','Müesseseler Başkanı'],['Dr. Murat Aktaş','Eğitim Başkanı'],['Musab Sungur','Tanıtım ve Medya Başkanı'],['Şükrü Can Atagün','Üniversiteler Komisyonu Başkanı'],['Hakan Birşen','Ortaöğretim Komisyonu Başkanı'],['Salih Kapukaya','Organizasyon ve Planlama Başkanı'],['Nurullah Özkul','Kültür, Sanat ve Sosyal Faaliyetler Başkanı']];let rows=JSON.parse(localStorage.getItem(key)||'null')||seed.map(x=>({name:x[0],title:x[1],group:'board',photo:'',bio:''}));function login(){if(user.value==='admin'&&pass.value==='milligenclikmgd1926'){document.querySelector('.login').style.display='none';document.querySelector('.app').style.display='block';draw()}else err.textContent='Kullanıcı adı veya şifre hatalı.'}function persist(){localStorage.setItem(key,JSON.stringify(rows))}function add(){rows.push({name:name.value,title:title.value,photo:photo.value,bio:bio.value,group:group.value});persist();name.value=title.value=photo.value=bio.value='';draw()}function del(i){rows.splice(i,1);persist();draw()}function move(i,d){const j=i+d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];persist();draw()}function draw(){list.innerHTML=rows.map((r,i)=>'<div class="row"><b>'+r.name+'</b><span>'+r.title+'</span><span>'+r.group+'</span><button onclick="move('+i+',-1)">↑</button><button onclick="move('+i+',1)">↓</button><button class="danger" onclick="del('+i+')">Sil</button></div>').join('')}</script></body></html>
